<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你从哪里来？（该网页由AI生成）</title>
    <style>
        /* 全局暗红黑基调 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: #0b0101; /* 深黑红 */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            transition: background-color 0.2s ease;
        }

        /* 两个页面的共用容器 */
        .app-container {
            width: 100%;
            max-width: 560px;
            background: #150303; /* 近黑色带红调 */
            border-radius: 2.5rem;
            border: 1px solid #4a1a1a;
            box-shadow: 0 20px 40px rgba(100, 0, 0, 0.3), 0 0 0 2px rgba(130, 20, 20, 0.2) inset;
            padding: 2.5rem 2rem 3rem 2rem;
            transition: all 0.3s ease;
        }

        /* 页面切换机制：使用类控制显示 */
        .page {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .page.active {
            display: block;
            opacity: 1;
        }

        /* ---------- 第一页样式 ---------- */
        .main-title {
            text-align: center;
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #d63e3e; /* 暗红亮光 */
            text-shadow: 0 0 10px #8b0000, 0 0 20px #4a0000;
            margin-bottom: 3.2rem;
            word-break: break-word;
            border-bottom: 2px solid #4d1515;
            padding-bottom: 1rem;
            /* 轻微渐变 */
            background: linear-gradient(135deg, #ff6b6b, #b33a3a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 18px rgba(200, 40, 40, 0.7);
        }

        /* 选项容器 */
        .options {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            margin-top: 1rem;
        }

        /* 选项按钮卡片风格 */
        .option-btn {
            background: #200a0a;
            border: 1.5px solid #641e1e;
            border-radius: 4rem;
            padding: 1.8rem 1.8rem;
            font-size: 1.7rem;
            font-weight: 600;
            color: #f0b3b3; /* 淡红白 */
            text-align: left;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 0 #200000, 0 10px 20px rgba(0, 0, 0, 0.6);
            letter-spacing: 0.5px;
            backdrop-filter: blur(2px);
            line-height: 1.3;
        }

        /* 选项开头的字母标记 */
        .option-prefix {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #3a0f0f;
            border-radius: 50%;
            width: 3.2rem;
            height: 3.2rem;
            font-size: 1.7rem;
            font-weight: 800;
            color: #f3a6a6;
            border: 1px solid #a13d3d;
            box-shadow: 0 0 10px #9b2c2c inset;
            flex-shrink: 0;
        }

        .option-text {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 悬停和选中效果 */
        .option-btn:hover {
            background: #2f0e0e;
            border-color: #b33a3a;
            color: #ffd6d6;
            transform: translateY(-3px);
            box-shadow: 0 10px 0 #2a0505, 0 15px 25px rgba(120, 0, 0, 0.5);
        }

        .option-btn:active {
            transform: translateY(2px);
            box-shadow: 0 4px 0 #1a0101, 0 8px 15px rgba(100, 0, 0, 0.6);
        }

        /* 第二页专用 */
        .password-page {
            text-align: center;
            padding: 1rem 0;
        }

        .back-message {
            font-size: 1.6rem;
            color: #b37272;
            margin-bottom: 1.8rem;
            letter-spacing: 1px;
            font-weight: 400;
            border-bottom: 1px dashed #652b2b;
            padding-bottom: 1.2rem;
        }

        .password-box {
            background: #110202;
            border: 2px solid #882e2e;
            border-radius: 3rem;
            padding: 2.4rem 1.5rem;
            margin: 1.8rem 0 2rem 0;
            box-shadow: 0 0 30px rgba(150, 20, 20, 0.5) inset, 0 10px 20px #000000;
        }

        .password-label {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #a85454;
            margin-bottom: 1rem;
            font-weight: 400;
        }

        .password-value {
            font-family: 'Courier New', 'Fira Code', monospace;
            font-size: 2.6rem;
            font-weight: 800;
            color: #ff5e5e;
            text-shadow: 0 0 15px #b30000, 0 0 30px #5c0000;
            background: #1f0505;
            padding: 0.8rem 1rem;
            border-radius: 1.5rem;
            display: inline-block;
            word-break: break-all;
            letter-spacing: 2px;
            border: 1px solid #b54b4b;
        }

        .decoration-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, #7f2a2a, #bc4b4b, #7f2a2a, transparent);
            margin: 1.8rem 0;
        }

        .hint {
            font-size: 1.1rem;
            color: #8f5353;
            font-style: italic;
            border-top: 1px solid #3a1717;
            padding-top: 1.5rem;
            letter-spacing: 0.5px;
        }

        /* 返回按钮 —— 暗红色小按钮 */
        .back-btn {
            background: #250b0b;
            border: 1px solid #7a3131;
            border-radius: 2rem;
            padding: 0.9rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #d9a0a0;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 1rem;
            letter-spacing: 0.8px;
            box-shadow: 0 4px 0 #1e0303;
            display: inline-block;
        }

        .back-btn:hover {
            background: #351010;
            color: #ffbebe;
            border-color: #b34b4b;
            transform: scale(1.02);
        }

        .back-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1e0303;
        }

        /* 让所有可点击元素去掉默认轮廓，保留自定义 */
        .option-btn:focus-visible,
        .back-btn:focus-visible {
            outline: 2px solid #c74545;
            outline-offset: 4px;
        }

        /* 移动端调整 */
        @media (max-width: 480px) {
            .app-container {
                padding: 1.8rem 1.2rem 2.5rem 1.2rem;
                border-radius: 2rem;
            }
