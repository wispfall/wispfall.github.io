<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言墙.byd</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #2d2d44 100%);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { color: #00e5ff; text-shadow: 0 0 10px rgba(0,229,255,0.5); }
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .form-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
        }
        input::placeholder { color: #aaa; }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #00e5ff;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #00b8cc; box-shadow: 0 0 15px #00e5ff; }
        .message {
            background: rgba(255, 255, 255, 0.08);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #00e5ff;
            animation: fadeIn 0.5s ease;
        }
        .message strong { color: #00e5ff; display: block; margin-bottom: 5px; }
        .message p { margin: 0; color: #ddd; line-height: 1.5; }
        #status { margin-top: 10px; font-size: 14px; color: #ffd700; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <h1>super 留言墙 time！</h1>
    <div class="container">
        <div class="form-group">
            <input type="text" id="name" placeholder="你的名字，网络上要保护好自己的个人信息" maxlength="20">
            <input type="text" id="content" placeholder="请说出你想对我骂（说）的东西" maxlength="100">
            <button onclick="submitMessage()">送达</button>
        </div>
        <div id="status"></div>
        <div id="messages" style="margin-top: 20px;">
            <!-- 留言会显示在这里 -->
        </div>
    </div>

    <script>
        // 你的仓库信息
        const owner = 'wispfall';
        const repo = 'wispfall.github.io';
        const issueNumber = 1; // 留言会存到第1号Issue里

        async function loadMessages() {
            const msgDiv = document.getElementById('messages');
            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/issues/${issueNumber}/comments`);
                const data = await res.json();
                msgDiv.innerHTML = '';
                if(data.length === 0) {
                    msgDiv.innerHTML = '<p style="text-align:center;color:#aaa;">还没有留言，来做第一个吧！</p>';
                    return;
                }
                data.forEach(comment => {
                    const div = document.createElement('div');
                    div.className = 'message';
                    const body = comment.body.split('|'); // 用 | 分割名字和内容
                    div.innerHTML = `<strong>${body[0] || '匿名'}</strong><p>${body[1] || comment.body}</p>`;
                    msgDiv.appendChild(div);
                });
            } catch(e) {
                msgDiv.innerHTML = '<p style="color:red;">你失败了，先刷新吧（男人叹气声）</p>';
            }
        }

        function submitMessage() {
            const name = document.getElementById('name').value;
            const content = document.getElementById('content').value;
            if(!content) { alert('你先别发了，我问你个事，为什么不写东西？'); return; }
            // 因为纯静态网页不能直接写API（会暴露Token），所以直接跳转到GitHub页面让用户提交
            const url = `https://github.com/${owner}/${repo}/issues/${issueNumber}#new_comment_field`;
            alert("你 即将跳转到 github.com 所以 so so 如此 所以");
            window.open(url, '_blank');
        }

        loadMessages();
    </script>
</body>
</html>
