<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Littlefly</title>
    <style>
        /* 基础页面重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', Courier, monospace; /* 采用等宽字体，增加极客感 */
            background-color: #0d1117; /* GitHub 风格的深邃黑 */
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        /* 超级大的标题 */
        h1 {
            font-size: 2rem;
            color: #58a6ff; /* 明亮的蓝色 */
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(88, 166, 255, 0.4); /* 发光效果 */
            margin-bottom: 20px;
            animation: fadeIn 1.5s ease-out;
        }
        /* 那行神秘的字 */
        p.secret-text {
            font-size: 1.5rem;
            color: #8b949e;
            letter-spacing: 5px;
            margin-bottom: 60px;
            font-weight: bold;
        }
        /* 前往留言板的按钮 */
        .nav-btn {
            text-decoration: none;
            color: #0d1117;
            background-color: #238636; /* GitHub 绿 */
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(35, 134, 54, 0.4);
        }
        .nav-btn:hover {
            background-color: #2ea043;
            transform: translateY(-3px); /* 悬浮时微微上浮 */
            box-shadow: 0 6px 20px rgba(46, 160, 67, 0.6);
        }
        /* 简单的入场动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- 大标题 -->
    <h1>wispfall的个人主页</h1>
    
    <!-- 神秘代码 -->
    <p class="secret-text">sb3=wp15</p>
    
    <!-- 导航按钮 -->
    <a href="message.html" class="nav-btn">前往心愿留言板 →</a>
</body>
</html>
